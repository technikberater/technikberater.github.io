    <meta charset="UTF-8">
    <title>TechnikBerater - Startseite</title>
    <style>
        /* HIER ÄNDERST DU DIE FARBEN */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            /* Hintergrundfarbe der ganzen Seite (Hex-Code) */
            background-color: #2c3e50; 
            color: white; /* Textfarbe auf dem Hintergrund */
            padding-top: 50px;
        }
        .container {
            /* Hintergrundfarbe der Karte */
            background: #ecf0f1; 
            width: 320px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 15px; /* Rundung der Ecken */
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); /* Schatten */
        }
        h1 { 
            color: #2c3e50; /* Farbe der Überschrift */
            margin-bottom: 10px;
        }
        p { 
            color: #7f8c8d; /* Farbe des Textes */
            line-height: 1.5;
        }
        /* Das Design für dein Bild */
        .profile-pic {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%; /* Macht das Bild kreisrund */
            border: 4px solid #3498db; /* Blauer Rand um das Bild */
            margin-bottom: 15px;
        }
        .btn {
            display: inline-block;
            background: #e74c3c; /* Button Farbe (Rot) */
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 25px; /* Runder Button */
            margin-top: 15px;
            font-weight: bold;
            transition: transform 0.2s; /* Animation */
        }
        .btn:hover {
            transform: scale(1.05); /* Button wird größer beim Drüberfahren */
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="bild.jpg" alt="Profilbild" class="profile-pic">
        
        <h1>Moin! 👋</h1>
        <p>Willkommen auf meiner persönlichen Seite. Ich teste gerade, wie man Webseiten baut.</p>

    <div id="paypal-container-K4ZPFRLA3N8GL"></div>
       <script>
         paypal.HostedButtons({
         hostedButtonId: "K4ZPFRLA3N8GL",
         }).render("#paypal-container-K4ZPFRLA3N8GL")
       </script>
    </div>

    <div class="container">
  <h1>Kontaktformular</h1>
  <form target="_blank" action="https://formsubmit.co/technikberater@web.de" method="POST">
    <div class="form-group">
      <div class="form-row">
        <div class="col">
          <input type="text" name="name" class="form-control" placeholder="Vor- und Nachname" required>
        </div>
        <div class="col">
          <input type="email" name="email" class="form-control" placeholder="E-mail-Adresse" required>
        </div>
      </div>
    </div>
    <div class="form-group">
      <textarea placeholder="Deine Nachricht" class="form-control" name="message" rows="10" required></textarea>
    </div>
    <button type="submit" class="btn btn-lg btn-dark btn-block">Anfrage abschicken</button>
  </form>
</div>

</body>
